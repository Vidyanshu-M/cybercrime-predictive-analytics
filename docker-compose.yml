version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cybertrace-db
    environment:
      POSTGRES_DB: cybertrace
      POSTGRES_USER: cyberadmin
      POSTGRES_PASSWORD: cyberpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberadmin -d cybertrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - ml-service

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
